pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}
dependencyResolutionManagement {
    repositories {
        google()
        mavenCentral()
    }
}
rootProject.name = "openandroiddex-launcher"
include ":app"
// `:linuxapp` used to be here: LinuxOnDroid, the proot container packaged as an
// app of its own. It went with the Linux feature (CHANGES.md, v0.7.0), so it is
// not built any more — and `assembleDebug` builds only :app, which is the APK
// the PC app ships.
